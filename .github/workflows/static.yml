```yaml
# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          PORT: 4173
          BASE_PATH: /EM/
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Fix GitHub Pages asset paths
        run: |
          python - <<'PY'
          from pathlib import Path

          for p in Path("dist/public").rglob("*"):
              if p.suffix in {".html", ".js", ".css"}:
                  s = p.read_text(encoding="utf-8")

                  s = s.replace("/EM/assets/", "__EM_ASSETS__")
                  s = s.replace("/assets/", "/EM/assets/")
                  s = s.replace("__EM_ASSETS__", "/EM/assets/")

                  s = s.replace("/EM/favicon.svg", "__EM_FAVICON__")
                  s = s.replace("/favicon.svg", "/EM/favicon.svg")
                  s = s.replace("__EM_FAVICON__", "/EM/favicon.svg")

                  p.write_text(s, encoding="utf-8")
          PY

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist/public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
```
